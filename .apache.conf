################################################################################
# Route requests through the CMS, including its protected uploads.              #
################################################################################
ServerName localhost
AllowEncodedSlashes NoDecode
<Directory /var/www/html>
    AllowOverride None
    Options -Indexes
    RewriteEngine On
    RewriteRule ^index\.php$ - [END]
    RewriteRule ^ index.php [END]
</Directory>

# Trust the Caddy container in this pod for the original IP and HTTPS status.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy ${POD_IP}
SetEnvIf X-Forwarded-Proto ^https$ HTTPS=on
